<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Rename photos chronologically, privately in your browser."
    />
    <title>Photo Chrono Renamer</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <section class="hero">
        <p class="eyebrow">LOCAL PHOTO ORGANIZER</p>
        <h1>Photo library in order</h1>
        <p class="lede">
          Create clean chronological filenames without uploading your images.
        </p>
        <button id="select-folder" class="primary">Select photo folder</button>
        <p id="support-note" class="support-note"></p>
      </section>

      <section class="workspace" aria-live="polite">
        <div class="workspace-heading">
          <div>
            <p class="eyebrow">RENAME PLAN</p>
            <h2 id="plan-title">Choose a folder to begin</h2>
          </div>
          <div class="actions">
            <button id="download-plan" class="secondary" disabled>Download plan</button>
            <button id="apply-renames" class="primary" disabled>Rename files</button>
          </div>
        </div>
        <div id="empty-state" class="empty-state">
          <p id="empty-copy">Select a folder of photos to preview chronological names.</p>
        </div>
        <div id="table-wrap" class="table-wrap" hidden>
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Current filename</th>
                <th>Capture time</th>
                <th>Source</th>
                <th>New filename</th>
              </tr>
            </thead>
            <tbody id="plan-body"></tbody>
          </table>
        </div>
      </section>
    </main>
    <template id="row-template"
      ><tr>
        <td class="index"></td>
        <td class="old-name"></td>
        <td class="date"></td>
        <td class="source"></td>
        <td class="new-name"></td></tr
    ></template>
    <script src="lib/exif-date.js"></script>
    <script src="lib/plan.js"></script>
    <script src="app.js"></script>
  </body>
</html>
